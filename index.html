    <script>
      (function () {
        let theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.classList.toggle(
          'dark-theme',
          theme === 'dark',
        );
      })();
    </script>
